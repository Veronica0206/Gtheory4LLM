name: Exact CRAN candidate readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only cancel an older run of this workflow on the same branch or PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'
  RENV_CONFIG_PPM_ENABLED: 'FALSE'
  PYTHONDONTWRITEBYTECODE: '1'
  MAKEFLAGS: '-j2'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          use-public-rspm: false
          cran: https://cran.r-project.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # Building a CRAN candidate now installs the package and knits its
      # vignette, so this job needs the runtime stack and the documentation
      # toolchain, not only R itself.
      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Install compilation dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libnlopt-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          packages: any::OpenMx, any::knitr, any::rmarkdown
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          upgrade: 'TRUE'
      - name: Build one candidate from audited, committed public sources
        run: python scripts/cran_readiness.py build --expected-data-kind public_llm_annotations --output-dir "$RUNNER_TEMP/cran-candidate"
      - name: Preserve exact release-built candidate for the next job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cran-candidate-built-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cran-candidate/*.tar.gz
            ${{ runner.temp }}/cran-candidate/candidate.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build and public-content audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cran-candidate-build-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cran-candidate/*.json
            ${{ runner.temp }}/cran-candidate/*.log
          if-no-files-found: ignore

  check-devel:
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: devel
          use-public-rspm: false
          cran: https://cran.r-project.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-tinytex@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Install PDF manual tools and fonts
        shell: bash
        run: |
          set -euo pipefail
          tlmgr update --self
          tlmgr install makeindex inconsolata helvetic times courier collection-latexrecommended
          command -v pdflatex
          command -v makeindex
      - name: Install compilation dependencies for the check
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libnlopt-dev libcurl4-openssl-dev libssl-dev libxml2-dev pandoc tidy
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          packages: any::OpenMx, any::lme4, any::ordinal, any::knitr, any::rmarkdown, any::V8
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          upgrade: 'TRUE'
      - name: Verify HTML manual math-rendering runtime
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("V8", quietly = TRUE))
          invisible(V8::v8()$eval("1 + 1"))
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cran-candidate-built-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded-cran-candidate
      - name: Check the downloaded archive with R-devel, CRAN incoming checks, and its PDF manual
        shell: bash
        run: |
          args=(check --require-devel --expected-data-kind public_llm_annotations --candidate-dir "$RUNNER_TEMP/downloaded-cran-candidate" --output-dir "$RUNNER_TEMP/cran-checked")
          if grep -qxE 'Version: 0\.4\.[01]' DESCRIPTION; then
            args+=(--cran-requested-maintenance "CRAN requested correction of the 0.2.0 noLD ERROR before 2026-10-26")
          fi
          python scripts/cran_readiness.py "${args[@]}"
      - name: Preserve the exact successfully checked candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cran-candidate-checked-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cran-checked/*.tar.gz
            ${{ runner.temp }}/cran-checked/candidate.json
            ${{ runner.temp }}/cran-checked/check_validation.json
            ${{ runner.temp }}/cran-checked/*.Rcheck/*-manual.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Preserve full check evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cran-candidate-check-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cran-checked/*.json
            ${{ runner.temp }}/cran-checked/*.log
            ${{ runner.temp }}/cran-checked/*.Rcheck
          if-no-files-found: ignore
          retention-days: 30

  nold:
    name: R-devel without long double
    needs: build-release
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      # Pinned by digest: "latest" is not an environment.
      image: ghcr.io/r-hub/containers/nold@sha256:4d8aeacfd5130c824ff593cde19e5ffaed96c170ca397837f56163a201e09389
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the container-native manifest checker
        # The host toolcache Python needs a newer glibc than this pinned image.
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          python3 --version
      - name: Fetch the candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cran-candidate-built-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Verify archive size, SHA-256, version and source commit
        run: python3 .github/nold/verify_candidate.py "$RUNNER_TEMP/candidate"
      - name: Require the environment CRAN calls noLD
        run: |
          Rscript -e 'stopifnot(Sys.info()[["sysname"]] == "Linux", Sys.info()[["machine"]] %in% c("x86_64", "amd64"), isFALSE(unname(capabilities("long.double"))), grepl("Under development", R.version.string, fixed = TRUE)); cat("Linux x86-64, R-devel, no long double: confirmed\n")'
      - name: Describe the platform
        run: |
          {
            Rscript -e 'cat(R.version.string, "\n"); cat("long double:", capabilities("long.double"), "| sizeof", .Machine$sizeof.longdouble, "\n"); cat("BLAS:", extSoftVersion()[["BLAS"]], "\nLAPACK:", La_library(), La_version(), "\n")'
            head -3 /etc/os-release
            grep -m1 'model name' /proc/cpuinfo || true
            gcc --version | sed -n '1p'
            for v in CC CFLAGS CXX CXXFLAGS FC FFLAGS; do printf '%s = %s\n' "$v" "$(R CMD config $v)"; done
          } | tee "$GITHUB_WORKSPACE/nold-evidence/platform.txt"
      - name: Install system tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake libnlopt-dev libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev pandoc tidy qpdf
          cmake --version | sed -n '1p'
          pandoc --version | sed -n '1p'
      - name: Select and verify reference BLAS for noLD
        # Qualify this R/noLD build with verified reference libraries. The
        # captured OpenBLAS dispatch failure remains separate from this gate.
        run: bash .github/nold/select_reference_blas.sh "$GITHUB_WORKSPACE/nold-evidence/reference-setup"
      - name: Install TeX for the PDF manual
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); install.packages("tinytex"); tinytex::install_tinytex(force = TRUE)'
          # Later steps run in fresh shells: put TeX on their PATH and prove it.
          texbin=$(Rscript -e 'cat(tinytex::tinytex_root())')/bin/x86_64-linux
          "$texbin/tlmgr" update --self
          "$texbin/tlmgr" install makeindex inconsolata helvetic times courier collection-latexrecommended
          for executable in pdflatex makeindex; do
            test -x "$texbin/$executable" || { echo "$executable is not at $texbin"; exit 1; }
          done
          echo "$texbin" >> "$GITHUB_PATH"
          "$texbin/pdflatex" --version | sed -n '1p'
      - name: Install the dependencies
        # From CRAN sources, compiled by this build of R: the container's
        # default binary repository did not download through install.packages().
        run: |
          Rscript -e 'options(Ncpus = 4L, repos = c(CRAN = "https://cloud.r-project.org")); wanted <- c("OpenMx", "Matrix", "lme4", "ordinal", "knitr", "rmarkdown"); need <- setdiff(wanted, rownames(installed.packages())); if (length(need)) install.packages(need, type = "source"); stopifnot(all(vapply(wanted, requireNamespace, logical(1), quietly = TRUE))); ip <- installed.packages()[, c("Package", "Version")]; ip <- ip[order(ip[, "Package"]), ]; print(ip, quote = FALSE, row.names = FALSE); write.csv(ip, file.path(Sys.getenv("GITHUB_WORKSPACE"), "nold-evidence", "installed-packages.csv"), row.names = FALSE)'
      - name: Install the exact archive
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/lib" "$RUNNER_TEMP/unpacked"
          R CMD INSTALL --no-docs --library="$RUNNER_TEMP/lib" "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/unpacked"
      - name: Verify reference BLAS with installed numerical dependencies
        # Loading the actual installed dependencies must not introduce another
        # BLAS provider after the initial environment proof.
        run: |
          set -euo pipefail
          : "${GTHEORY_REFERENCE_BASELINE:?missing reference backend baseline}"
          test -f "$GTHEORY_REFERENCE_BASELINE"
          R_LIBS="$RUNNER_TEMP/lib" Rscript --vanilla .github/nold/check_reference_blas.R reference "$GITHUB_WORKSPACE/nold-evidence/reference-loaded" Matrix OpenMx lme4 ordinal Gtheory4LLM 2>&1 | tee "$GITHUB_WORKSPACE/nold-evidence/reference-loaded.txt"
      - name: Show how the fit CRAN reported ends on this build
        # Evidence, recorded before the gate so that a refused check still
        # leaves it; the script's own failure would fail the job.
        run: |
          set -euo pipefail
          Rscript --vanilla .github/nold/diagnose.R "$RUNNER_TEMP/lib" 2>&1 | tee "$GITHUB_WORKSPACE/nold-evidence/boundary-fit-diagnosis.txt"
      - name: Check the exact archive
        # As CRAN's noLD check does: the whole check, vignettes and PDF manual
        # included, continuing past a failed test file so every one is reported.
        run: |
          set -e
          command -v pdflatex || { echo "pdflatex is not on the PATH"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/nold-evidence/check"
          cd "$GITHUB_WORKSPACE/nold-evidence/check"
          status=0
          R CMD check --no-stop-on-test-error "$ARCHIVE" || status=$?
          log=$(find . -name 00check.log)
          grep -E '^Status:|\.\.\. (ERROR|WARNING|NOTE)' "$log" || true
          if [ "$status" -ne 0 ]; then echo "R CMD check exited with status $status"; tail -80 "$log"; exit 1; fi
          if ! grep -q '^Status: OK' "$log"; then echo "The check did not end with Status: OK"; tail -80 "$log"; exit 1; fi
      - name: Run every installed test of the exact archive
        run: Rscript --vanilla .github/nold/run_tests.R "$RUNNER_TEMP/lib" "$RUNNER_TEMP/unpacked/Gtheory4LLM/tests" "$GITHUB_WORKSPACE/nold-evidence/installed-tests" 2>&1 | tee "$GITHUB_WORKSPACE/nold-evidence/installed-tests-summary.txt"
      - name: Recheck reference BLAS after the complete test run
        run: |
          set -euo pipefail
          : "${GTHEORY_REFERENCE_BASELINE:?missing reference backend baseline}"
          test -f "$GTHEORY_REFERENCE_BASELINE"
          R_LIBS="$RUNNER_TEMP/lib" Rscript --vanilla .github/nold/check_reference_blas.R reference "$GITHUB_WORKSPACE/nold-evidence/reference-final" Matrix OpenMx lme4 ordinal Gtheory4LLM 2>&1 | tee "$GITHUB_WORKSPACE/nold-evidence/reference-final.txt"
      - name: Keep the evidence
        # The candidate manifest and the archive's verified identity, the
        # platform and installed packages, the check log and every test output.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nold-evidence-${{ github.sha }}
          path: |
            nold-evidence/*.json
            nold-evidence/*.txt
            nold-evidence/*.csv
            nold-evidence/check/**/00check.log
            nold-evidence/check/**/00install.out
            nold-evidence/check/**/tests/*.Rout
            nold-evidence/check/**/tests/*.Rout.fail
            nold-evidence/installed-tests/
            nold-evidence/specimens/
            nold-evidence/reference-setup/
            nold-evidence/reference-loaded/
            nold-evidence/reference-final/
          if-no-files-found: error
          retention-days: 90
