name: R and platform compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only cancel an older run of this workflow on the same branch or PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            r: release
            minimum: false
          - os: macos-latest
            r: release
            minimum: false
          - os: ubuntu-22.04
            r: '4.5.0'
            minimum: true
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'
      RENV_CONFIG_PAK_ENABLED: 'FALSE'
      RENV_CONFIG_PPM_ENABLED: 'FALSE'
      RENV_CONFIG_CACHE_SYMLINKS: 'FALSE'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release correspondence reads the artifact's recorded source commit.
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # The package check builds the vignette, which needs pandoc on every
      # platform in this matrix rather than whatever the runner image ships.
      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Install minimum-R compilation dependencies
        if: matrix.minimum
        run: sudo apt-get update && sudo apt-get install -y cmake libnlopt-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.minimum
        with:
          path: ${{ runner.temp }}/gtheory-minimum-library
          key: ubuntu-22.04-source-R-4.5.0-${{ hashFiles('scripts/dependency-locks/R-4.5.0.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.minimum
        with:
          path: ${{ runner.temp }}/renv-bootstrap
          key: renv-bootstrap-${{ hashFiles('scripts/dependency-locks/renv-bootstrap.json') }}
      - name: Restore R 4.5.0-compatible exact dependencies
        if: matrix.minimum
        shell: bash
        run: Rscript --vanilla scripts/restore_validation.R "$RUNNER_TEMP/gtheory-minimum-library" scripts/dependency-locks/R-4.5.0.lock
        env:
          GTHEORY_RENV_BOOTSTRAP_CACHE: ${{ runner.temp }}/renv-bootstrap
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        if: ${{ !matrix.minimum }}
        with:
          packages: any::OpenMx, any::lme4, any::ordinal, any::knitr, any::rmarkdown
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          upgrade: 'TRUE'
      - name: Check supported source and installed-package behavior
        shell: bash
        env:
          GTHEORY_PACKAGE_CHECK_DIR: ${{ runner.temp }}/gtheory-package-check
        run: |
          set -o pipefail
          args=(--scope source --compatibility --compact --output "$RUNNER_TEMP/compatibility.json")
          if [[ '${{ matrix.minimum }}' == 'true' ]]; then
            args+=(--library "$RUNNER_TEMP/gtheory-minimum-library")
          fi
          python scripts/run_validation.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/compatibility.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-R-${{ matrix.r }}
          path: |
            ${{ runner.temp }}/compatibility.json
            ${{ runner.temp }}/compatibility.log
            ${{ runner.temp }}/gtheory-package-check/*.json
            ${{ runner.temp }}/gtheory-package-check/*.log
            ${{ runner.temp }}/gtheory-package-check/*.Rcheck
          if-no-files-found: ignore
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code
