name: Full numerical validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only cancel an older run of this workflow on the same branch or PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      RENV_CONFIG_PAK_ENABLED: "FALSE"
      RENV_CONFIG_PPM_ENABLED: "FALSE"
      RENV_CONFIG_CACHE_SYMLINKS: "FALSE"
      MAKEFLAGS: "-j2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release manifests record the source commit preceding the bundle.
          fetch-depth: 0
      # Record the execution environment for numerical refusals. A differing CPU
      # is contextual evidence, not a demonstrated cause of a failed solve.
      - name: Record the runner CPU
        shell: bash
        run: |
          {
            case "$RUNNER_OS" in
              Linux)
                grep -m1 'model name' /proc/cpuinfo
                grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sse4_2|avx|avx2|fma|avx512f|avx512dq|avx512bw|avx512vl)$' | tr '\n' ' '
                echo ;;
              macOS) sysctl -n machdep.cpu.brand_string ;;
              Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
            esac
          } 2>&1 | tee "$RUNNER_TEMP/runner-cpu.txt" || true
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: "4.5.3"
          use-public-rspm: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # scripts/build_manual.R is the only gate that rejects overfull boxes in
      # the reference manual; R CMD check runs --no-manual and would accept
      # them. Give this job a LaTeX engine so the gate actually runs here.
      - uses: r-lib/actions/setup-tinytex@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Install reference-manual fonts
        run: tlmgr install inconsolata helvetic times courier collection-latexrecommended
      - name: Install compilation dependencies
        # libuv1-dev is needed by fs, which rmarkdown reaches through sass and
        # bslib. Without it the vignette toolchain silently fails to install and
        # the gate falls back to checking without vignettes.
        run: sudo apt-get update && sudo apt-get install -y cmake libnlopt-dev libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev pandoc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gtheory-validation-library
          key: ubuntu-24.04-source-v3-R-4.5.3-${{ hashFiles('renv.lock', 'scripts/dependency-locks/documentation.lock') }}
      - name: Check documentation lock preserves the numerical environment
        run: python3 scripts/check_documentation_lock.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/renv-bootstrap
          key: renv-bootstrap-${{ hashFiles('scripts/dependency-locks/renv-bootstrap.json') }}
      - name: Restore exact numerical and R documentation dependencies
        run: Rscript --vanilla scripts/restore_validation.R "$RUNNER_TEMP/gtheory-validation-library" scripts/dependency-locks/documentation.lock
        env:
          GTHEORY_RENV_BOOTSTRAP_CACHE: ${{ runner.temp }}/renv-bootstrap
      - name: Require the locked vignette tools
        run: |
          Rscript --vanilla -e '
            .libPaths(c(Sys.getenv("R_LIBS_TARGET"), .libPaths()))
            for (p in c("knitr", "rmarkdown")) {
              if (!requireNamespace(p, quietly = TRUE)) stop("Vignette tool unavailable: ", p)
              cat(p, as.character(packageVersion(p)), "\n")
            }'
        env:
          R_LIBS_TARGET: ${{ runner.temp }}/gtheory-validation-library
      - name: Stage and verify the validation bundle without replacing the published release
        env:
          R_LIBS_USER: ${{ runner.temp }}/gtheory-validation-library
        shell: bash
        run: python scripts/stage_validation_bundle.py --output-dir "$RUNNER_TEMP/validation-bundle" --github-env "$GITHUB_ENV"
      - name: Run clean-session validation with required independent comparisons
        env:
          GTHEORY_PACKAGE_CHECK_DIR: ${{ runner.temp }}/gtheory-package-check
          GTHEORY_ARTIFACT_CHECK_DIR: ${{ runner.temp }}/gtheory-committed-artifact
          # The overfull-box gate reports which box overflowed only in the
          # LaTeX log. Build somewhere the upload step can reach it.
          GTHEORY_MANUAL_CHECK_DIR: ${{ runner.temp }}/gtheory-manual
          # Issue #14 recurs intermittently and the tests print their evidence
          # to the log, which is enough to read and not enough to replay. When
          # a run trips a retention trigger it writes the exact matrices and
          # right-hand sides here instead, and the upload step below preserves
          # them. Outside the repository on purpose: the last step of this job
          # asserts that running the tests changed no tracked file.
          GTHEORY_ISSUE14_ARTIFACT_DIR: ${{ runner.temp }}/gtheory-issue14
          # The package's own capture, as in the compatibility matrix: a refused
          # start or an unusable evaluation writes its failed operation here.
          GTHEORY_DISCRETE_SPECIMEN_DIR: ${{ runner.temp }}/gtheory-specimens
        shell: bash
        run: |
          set -o pipefail
          args=(--scope all --as-cran --release-manifest "$GTHEORY_VALIDATION_MANIFEST" --library "$RUNNER_TEMP/gtheory-validation-library" --output "$RUNNER_TEMP/full-validation.json")
          if grep -qx 'Version: 0.4.0' DESCRIPTION; then
            args+=(--cran-requested-maintenance "CRAN requested correction of the 0.2.0 noLD ERROR before 2026-10-26")
          fi
          python3 scripts/run_validation.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/full-validation.log"
      - name: Preserve validation summary and detailed package logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-validation-evidence
          path: |
            ${{ runner.temp }}/validation-bundle/
            ${{ runner.temp }}/full-validation.json
            ${{ runner.temp }}/full-validation.log
            ${{ runner.temp }}/gtheory-package-check/*.json
            ${{ runner.temp }}/gtheory-package-check/*.log
            ${{ runner.temp }}/gtheory-package-check/*.Rcheck
            ${{ runner.temp }}/gtheory-committed-artifact/*.json
            ${{ runner.temp }}/gtheory-committed-artifact/*.log
            ${{ runner.temp }}/gtheory-manual/*.pdf
            ${{ runner.temp }}/gtheory-manual/work/*.log
            ${{ runner.temp }}/gtheory-manual/work/*.tex
            ${{ runner.temp }}/gtheory-issue14/*.rds
            ${{ runner.temp }}/gtheory-specimens/*.rds
            ${{ runner.temp }}/runner-cpu.txt
          if-no-files-found: ignore
      - name: Ensure verification and tests did not change tracked files
        run: git diff --exit-code
