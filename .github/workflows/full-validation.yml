name: Full numerical validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      RENV_CONFIG_PAK_ENABLED: "FALSE"
      RENV_CONFIG_PPM_ENABLED: "FALSE"
      RENV_CONFIG_CACHE_SYMLINKS: "FALSE"
      MAKEFLAGS: "-j2"
    steps:
      - uses: actions/checkout@v4
        with:
          # Release manifests record the source commit preceding the bundle.
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compilation dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libnlopt-dev libcurl4-openssl-dev libssl-dev libxml2-dev pandoc
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gtheory-validation-library
          key: ubuntu-24.04-source-v2-R-4.5.3-${{ hashFiles('renv.lock') }}
      - name: Restore exact R dependencies
        run: Rscript --vanilla scripts/restore_validation.R "$RUNNER_TEMP/gtheory-validation-library"
      # knitr and rmarkdown build the vignette; they are documentation tools,
      # not part of the numerical stack the lockfile pins, so install them
      # beside the restored library rather than recording them in renv.lock.
      - name: Install the vignette build toolchain beside the locked library
        run: |
          Rscript --vanilla -e 'install.packages(c("knitr","rmarkdown"), lib=Sys.getenv("R_LIBS_TARGET"), repos="https://cloud.r-project.org")'
        env:
          R_LIBS_TARGET: ${{ runner.temp }}/gtheory-validation-library
      - name: Run clean-session validation with required independent comparisons
        env:
          GTHEORY_PACKAGE_CHECK_DIR: ${{ runner.temp }}/gtheory-package-check
          GTHEORY_ARTIFACT_CHECK_DIR: ${{ runner.temp }}/gtheory-committed-artifact
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run_validation.py --scope all --as-cran --library "$RUNNER_TEMP/gtheory-validation-library" --output "$RUNNER_TEMP/full-validation.json" 2>&1 | tee "$RUNNER_TEMP/full-validation.log"
      - name: Preserve validation summary and detailed package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-evidence
          path: |
            ${{ runner.temp }}/full-validation.json
            ${{ runner.temp }}/full-validation.log
            ${{ runner.temp }}/gtheory-package-check/*.json
            ${{ runner.temp }}/gtheory-package-check/*.log
            ${{ runner.temp }}/gtheory-package-check/*.Rcheck
            ${{ runner.temp }}/gtheory-committed-artifact/*.json
            ${{ runner.temp }}/gtheory-committed-artifact/*.log
          if-no-files-found: ignore
      - name: Ensure verification and tests did not change tracked files
        run: git diff --exit-code
